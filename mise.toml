#
# The tools needed to work on clusterctl, so that everyone builds and lints it
# with the same ones. Install them with "mise install".
#
# Hugo is deliberately absent: the documentation site needs the extended build,
# and neither mise's registry nor aqua ships a package that guarantees it.
# site/README.md says which version to install.

[tools]
# The Go release line CI and the release build with, which
# .github/actions/setup-go reads from here; mise takes its newest patch, as
# they do. go.mod states the oldest version the code compiles with.
go = "1.26"

# The major version .golangci.yml is written against.
golangci-lint = "2"

# The sops the tests encrypt and decrypt Secret documents with, which CI
# installs from here too. clusterctl runs sops to read a Secret, so the tests
# need it.
sops = "3.13.3"
