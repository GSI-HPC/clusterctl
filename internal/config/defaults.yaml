#
# The built-in defaults, the first layer every configuration is merged onto.
# A value set here is reported by "clusterctl config view --show-sources" as
# coming from the defaults layer.

naming:
  rules:
    - fqdn: "{name}"
      bmc: "{bmcPrefix}{name}"

bmc:
  # Redfish first: IPMI over LAN ships disabled on current iLO, XCC and iDRAC
  # firmware, so trying it first only produces timeouts.
  order: [redfish, ipmi]
  ipmi:
    backend: ipmipower
    driver: LAN_2_0
    ipmipowerPath: /usr/sbin/ipmipower
    ipmitoolPath: /usr/bin/ipmitool
    timeout: 60s
  redfish:
    timeout: 30s
    maxConcurrent: 8
    minTlsVersion: "1.2"
    systemPath: /redfish/v1/Systems/1
  pdu:
    nameFormat: "pdu%s-%s"
    user: admin

ssh:
  # ssh reads neither file on its own once it is given -F, so the generated
  # file includes both, in the order ssh itself reads them: the
  # administrator's own configuration, then the system one with its crypto
  # policies, GSSAPI settings and site defaults. Neither can change which host
  # keys are trusted or turn multiplexing on for a node; the generated file
  # settles both first.
  include:
    - ~/.ssh/config
    - /etc/ssh/ssh_config
  connectTimeout: 10s
  connectionAttempts: 2
  serverAliveInterval: 60s
  serverAliveCountMax: 3
  controlPersist: 5m
  binary: ssh
  scpBinary: scp
  # CheckHostIP and HashKnownHosts are not listed here: the generated
  # configuration always sets them, because ssh appends address based entries
  # to the shared host key file without taking a lock when they are on.

safety:
  confirmAbove: 8
  # Power actions ask Slurm whether a node runs a job, on every site that
  # names a host role for slurm.role. Turning this off is said before every
  # power question.
  slurmAware: true
  powerOnBatch: 8
  powerOnStagger: 5s

fanout:
  max: 16
  commandTimeout: 10m

slurm:
  lookBack: 1h

services:
  dhcp:
    configPath: /etc/dhcp/dhcpd.conf
    cacheTtl: 2m
    logPath: /var/log/syslog
    interface: ib0
  pxesrv:
    root: /srv/pxesrv
    bootPath: /srv/pxesrv/boot
    logPath: /var/log/pxesrv.log
  tftp:
    root: /srv/tftp
    grubPath: /srv/tftp/grub
    logPath: /var/log/syslog
  cinc:
    soloConfigPath: /etc/cinc/solo
    binary: cinc-solo
  dns:
    timeout: 5s
