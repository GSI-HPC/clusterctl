# SPDX-License-Identifier: LGPL-3.0-or-later

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # The Go release line, as in CI. The newest patch of it builds the release,
  # so every release carries the standard library's latest security fixes.
  GO_VERSION: '1.26'

jobs:
  verify-tag:
    name: Verify the tag is signed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The version of a release exists only in its tag, so the tag has to be
      # a statement by a person holding a key rather than a label anyone with
      # write access can move.
      - name: Refuse an unsigned or lightweight tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if [ "$(git cat-file -t "$tag")" != "tag" ]; then
            echo "::error::$tag is a lightweight tag; releases are cut from signed annotated tags"
            echo "  git tag -s $tag -m 'clusterctl $tag'"
            exit 1
          fi

          if ! git cat-file tag "$tag" | grep -qE 'BEGIN (PGP|SSH) SIGNATURE'; then
            echo "::error::$tag carries no signature; releases are cut from signed tags"
            exit 1
          fi

          if [ -f .github/allowed_signers ]; then
            git config gpg.ssh.allowedSignersFile .github/allowed_signers
            if git verify-tag "$tag"; then
              echo "::notice::$tag is signed by a listed signer"
            else
              echo "::error::$tag is signed, but not by anyone in .github/allowed_signers"
              exit 1
            fi
          else
            echo "::notice::$tag is signed; add .github/allowed_signers to verify who signed it"
          fi

  test:
    name: Test
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: make lint
      - run: go test ./...

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Minting a Sigstore signing certificate and storing the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attest every published archive. checksums.txt already names each
      # artifact and its digest, so one call covers the whole release.
      #
      # This is what lets an installer verify where a binary came from without
      # a key exchange: mise checks GitHub artifact attestations by default,
      # and "gh attestation verify" does the same by hand.
      - name: Attest the release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
