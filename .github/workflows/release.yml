name: Release

on:
  push:
    tags: ['v*']

# Read only, unless a job says otherwise: only the release job writes.
permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify the tag is signed
    runs-on: ubuntu-latest
    outputs:
      object: ${{ steps.verify.outputs.object }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The signers' keys are repository variables, which only an
      # administrator can change, and never a file in the checkout: the tagged
      # commit would otherwise name its own signers. Without them no release
      # is cut.
      - name: Refuse a tag not signed by a listed signer
        id: verify
        env:
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
          ALLOWED_PGP_KEYS: ${{ vars.RELEASE_ALLOWED_PGP_KEYS }}
        run: .github/scripts/verify-release-tag.sh

  # The tests and the checks of the source run side by side, and the
  # release waits for both.
  test:
    name: Test
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          sops: true
          cache: test
      - run: go test ./...

  lint:
    name: Lint
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make lint

  release:
    name: Build and publish
    needs: [verify-tag, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Minting a Sigstore signing certificate and storing the attestation.
      id-token: write
      attestations: write
    # Protection rules on this environment, such as a required reviewer or a
    # rule that only v* tags deploy, hold the release until they are met.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag may have moved since it was verified; what is built is the tag
      # object that was verified and the commit it names, or nothing.
      - name: Refuse a tag that moved since it was verified
        env:
          TAG: ${{ github.ref_name }}
          OBJECT: ${{ needs.verify-tag.outputs.object }}
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          if [ -z "$OBJECT" ] || [ "$(git rev-parse --verify "refs/tags/$TAG")" != "$OBJECT" ]; then
            echo "::error::$TAG no longer points at the verified tag object $OBJECT"
            exit 1
          fi
          if [ "$(git rev-parse --verify HEAD)" != "$COMMIT" ]; then
            echo "::error::the checkout is not the verified commit $COMMIT"
            exit 1
          fi

      - uses: ./.github/actions/setup-go

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The verified tag, not whichever tag on this commit GoReleaser
          # would otherwise pick.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # Attest every published archive. checksums.txt already names each
      # artifact and its digest, so one call covers the whole release.
      #
      # This is what lets an installer verify where a binary came from without
      # a key exchange: mise checks GitHub artifact attestations by default,
      # and "gh attestation verify" does the same by hand.
      - name: Attest the release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
