name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Go and sops come from .github/actions/setup-go at the versions mise.toml
# names. This is the oldest sops clusterctl supports (secrets.MinSopsVersion),
# which one job tests with; doc/release.md says how to raise it.
env:
  SOPS_MIN_VERSION: '3.10.0'

jobs:
  # The binary is built and smoke tested first, so that one that does not
  # work fails within a minute, and then the tests run; on Linux with the
  # coverage measured, which is the same run. The race detector has a job
  # of its own: after the tests here it was the longest step of the
  # longest job.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          sops: true
          cache: test

      - name: Build
        run: make build

      # The binary has to work, not only compile: this runs the real command
      # tree against the example configuration that ships with the manual.
      - name: Smoke test against the example configuration
        env:
          CLUSTERCTL_CONFIG: examples/site
        run: |
          set -euxo pipefail
          ./bin/clusterctl version
          ./bin/clusterctl config validate
          ./bin/clusterctl config view --show-sources > /dev/null
          ./bin/clusterctl node list
          ./bin/clusterctl node select '@inventory:exe!exe0003'
          ./bin/clusterctl node fqdn -n 'exe[1-3]' --bmc
          ./bin/clusterctl exec --dry-run -n 'exe[1-3]' --confirm -- uptime
          # A reinstall resolves the BMC credential before it asks, even in
          # a dry run. --no-reset leaves Slurm, which no runner can reach,
          # out of it. The dry run reads the PXE host as the real run does,
          # and no runner can reach that either, so ssh is a stand-in: one
          # that finds every boot path, and one that reports the boot path
          # of exe0001 missing, which has to refuse the dry run with exit 2.
          present="$RUNNER_TEMP/ssh-present"
          missing="$RUNNER_TEMP/ssh-missing"
          printf '#!/bin/sh\nexit 0\n' > "$present"
          printf '#!/bin/sh\n[ "$1" = -V ] || echo /srv/pxesrv/boot/cluster/1.0/exe/ipxe.net2\n' > "$missing"
          chmod 755 "$present" "$missing"
          BMC_PASSWORD=smoke ./bin/clusterctl --set ssh.binary="$present" provision reinstall --dry-run --no-reset -n exe0001
          code=0
          BMC_PASSWORD=smoke ./bin/clusterctl --set ssh.binary="$missing" provision reinstall --dry-run --no-reset -n exe0001 || code=$?
          test "$code" -eq 2

      # What config init writes has to be accepted by the rest of the binary,
      # and a second run into the same directory has to be refused.
      - name: Smoke test a scaffolded configuration
        run: |
          set -euxo pipefail
          dir="$RUNNER_TEMP/scaffold"
          ./bin/clusterctl config init "$dir" --site lab --cluster alpha --domain hpc.example.org
          CLUSTERCTL_CONFIG="$dir" ./bin/clusterctl config validate
          CLUSTERCTL_CONFIG="$dir" ./bin/clusterctl node fqdn -n 'node[1-3]'
          if ./bin/clusterctl config init "$dir"; then exit 1; fi

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Test and measure coverage
        if: runner.os == 'Linux'
        run: make cover

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  race:
    name: Race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          sops: true
          cache: race

      - name: Test under the race detector
        run: go test -race ./...

  # The oldest sops clusterctl accepts has to read and refuse everything the
  # current one does. Its tests encrypt with it too.
  sops-minimum:
    name: Test with the oldest sops supported
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          sops-version: ${{ env.SOPS_MIN_VERSION }}
          cache: test

      - name: Test
        run: |
          sops --disable-version-check --version | grep -Fx "sops ${SOPS_MIN_VERSION}"
          go test ./...

  # The binary against a Slurm cluster in Docker, which sind creates: real
  # ssh, a real sshd on every node, a real slurmctld and slurmd, on each Slurm
  # release line sind publishes a node image for. doc/testing.md says what
  # the suite covers.
  e2e:
    name: End to end (Slurm ${{ matrix.slurm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slurm: ['25.11', '26.05']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache: e2e

      # Built before the cluster is made, so that a binary that does not
      # build fails the job at once.
      - name: Build
        run: make build

      # The sind mise.toml pins, and the cluster of e2e/testdata with the
      # node image of this Slurm release line.
      - name: Prepare the cluster
        id: prepare
        env:
          SLURM: ${{ matrix.slurm }}
        run: |
          set -euo pipefail
          sind=$(sed -n 's/^"github:GSI-HPC\/sind" = { version = "\([0-9.]*\)".*$/\1/p' mise.toml)
          if [ -z "$sind" ]; then
            echo "::error::mise.toml names no sind version"
            exit 1
          fi
          echo "sind=v$sind" >> "$GITHUB_OUTPUT"
          config="$RUNNER_TEMP/sind-cluster.yaml"
          yq '.defaults.image = "ghcr.io/gsi-hpc/sind-node:" + strenv(SLURM)' e2e/testdata/sind-cluster.yaml > "$config"
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - uses: GSI-HPC/sind-action@v2
        with:
          version: ${{ steps.prepare.outputs.sind }}
          realm: e2e
          clusters: |
            - ${{ steps.prepare.outputs.config }}

      # The host key commands dial the nodes themselves, not through sind's
      # relay, so the names of the nodes have to resolve on the runner.
      - name: Resolve the node names
        run: make e2e-hosts | sudo tee -a /etc/hosts

      # -o build: the binary built above is the one tested.
      - name: Test
        run: make -o build e2e

      - name: Collect the logs of the nodes
        if: failure()
        run: |
          dir="$RUNNER_TEMP/sind-logs"
          mkdir -p "$dir"
          for unit in controller:slurmctld submitter:sshd worker-0:slurmd worker-1:slurmd worker-2:slurmd; do
            node=${unit%%:*}
            sind --realm e2e logs "$node.alpha" "${unit#*:}" > "$dir/$node-${unit#*:}.log" 2>&1 || true
            sind --realm e2e logs "$node.alpha" sshd > "$dir/$node-sshd.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sind-logs-slurm-${{ matrix.slurm }}
          path: ${{ runner.temp }}/sind-logs/
          retention-days: 14

      - uses: GSI-HPC/sind-action/cleanup@v2
        if: always()

  # golangci-lint vets and checks the formatting of the end-to-end tests too,
  # which is what make lint does, so make lint is left to contributors.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Check that the module requirements are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Pinned, so that a new release of the linter, with checks of its own,
      # fails no change that did not cause it; raised by hand.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      # The newest govulncheck on purpose: a vulnerability it learns to see
      # is what this job is for. Its findings come from the database, which
      # it always reads afresh.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Each fuzz job runs a set number of executions, about a minute's worth,
  # rather than a set time. With a duration, the fuzzing coordinator in Go's
  # testing package races its own deadline: when -fuzztime runs out it can
  # report the deadline as the failure, "context deadline exceeded" with no
  # input, as it did on a change that touched none of the parsers. A count
  # has no deadline. The node set parser, the progress sanitiser and the
  # terminal escaper are fuzzed in the CI of go-nodeset and go-clikit.
  #
  # -fuzzminimizetime caps how long each input found is minimized. CI keeps
  # no corpus, so every run starts cold and finds many, and with all four
  # workers minimizing, fuzzing stopped for half a minute at a time, which
  # a count makes the run wait out. A failing input is still written, if
  # less minimized; a local run minimizes it fully. timeout-minutes bounds
  # a target that has become slow, which is a failure of its own.
  fuzz-nodeexpr:
    name: Fuzz the node set guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      # Every expression clusterctl resolves groups in passes the check in
      # nodeexpr before go-nodeset reads it, so for any input the check has
      # to name the hosts go-nodeset names and refuse nothing go-nodeset
      # reads but a group reference without a name.
      - name: Fuzz
        run: go test ./internal/nodeexpr/ -run '^$' -fuzz FuzzParseWith -fuzztime 4500000x -fuzzminimizetime 1000x

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-nodeexpr
          path: internal/nodeexpr/testdata/fuzz/

  fuzz-dhcp:
    name: Fuzz the DHCP parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      # The parser reads a file another host serves, so it must never
      # panic, whatever that file holds.
      - name: Fuzz
        run: go test ./internal/dhcp/ -run '^$' -fuzz FuzzParse -fuzztime 2500000x -fuzzminimizetime 1000x

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-dhcp
          path: internal/dhcp/testdata/fuzz/

  fuzz-config:
    name: Fuzz the configuration parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      # Every command reads the configuration, and the loader turns what
      # the YAML library decoded into its own tree, so no file may make it
      # panic, and every key it reads has the line it was written on.
      - name: Fuzz
        run: go test ./internal/config/ -run '^$' -fuzz FuzzParseDocuments -fuzztime 1000000x -fuzzminimizetime 1000x

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-config
          path: internal/config/testdata/fuzz/

  # The release ships a static binary, so the release targets have to build
  # without cgo on every change rather than at tag time; an operating system
  # to a job, side by side.
  cross-build:
    name: Cross build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache: cross-${{ matrix.goos }}

      - name: Build every release target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
        run: |
          set -euxo pipefail
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/clusterctl
          done

  release-tag:
    name: Release tag verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release workflow runs only when a tag is pushed, so the check that
      # refuses a tag is tested here against tags made on the spot.
      - name: Test the tag verification
        run: .github/scripts/verify-release-tag_test.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      # The whole history: every release's manual is built from its tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go

      # The Hugo releases build.sh fetches, and checks against their
      # checksums, for every manual: the one main names is kept.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/clusterctl-site
          key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/hugo-version') }}

      # The site as the Pages workflow publishes it, every release's manual
      # included, so a change that would break publishing fails here. The
      # command reference and the schemas are generated on the way, so a
      # command that cannot be documented is a broken command.
      - name: Build the manual of every version
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/build.sh https://gsi-hpc.github.io/clusterctl/
