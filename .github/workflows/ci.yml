name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go release line clusterctl is built with. go.mod states the oldest
  # version the code compiles with; CI and the release take the newest patch
  # of this line instead, because that is the one carrying the standard
  # library's security fixes.
  GO_VERSION: '1.26'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: make build

      - name: Test
        run: go test ./...

      - name: Test under the race detector
        run: go test -race ./...

      # The binary has to work, not only compile: this runs the real command
      # tree against the example configuration that ships with the manual.
      - name: Smoke test against the example configuration
        env:
          CLUSTERCTL_CONFIG: examples/site
        run: |
          set -euxo pipefail
          ./bin/clusterctl version
          ./bin/clusterctl config validate
          ./bin/clusterctl config view --show-sources > /dev/null
          ./bin/clusterctl node list
          ./bin/clusterctl node select '@inventory:exe!exe0003'
          ./bin/clusterctl node fqdn -n 'exe[1-3]' --bmc
          ./bin/clusterctl exec --dry-run -n 'exe[1-3]' --confirm -- uptime
          # A reinstall resolves the BMC credential before it asks, even in
          # a dry run. --no-reset leaves Slurm, which no runner can reach,
          # out of it.
          BMC_PASSWORD=smoke ./bin/clusterctl provision reinstall --dry-run --no-reset -n exe0001

      # What config init writes has to be accepted by the rest of the binary,
      # and a second run into the same directory has to be refused.
      - name: Smoke test a scaffolded configuration
        run: |
          set -euxo pipefail
          dir="$RUNNER_TEMP/scaffold"
          ./bin/clusterctl config init "$dir" --site lab --cluster alpha --domain hpc.example.org
          CLUSTERCTL_CONFIG="$dir" ./bin/clusterctl config validate
          CLUSTERCTL_CONFIG="$dir" ./bin/clusterctl node fqdn -n 'node[1-3]'
          if ./bin/clusterctl config init "$dir"; then exit 1; fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Measure coverage
        run: make cover

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Vet and check formatting
        run: make lint

      - name: Check that the module requirements are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    name: Fuzz the node set parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Folding has to be idempotent: the printed form of a set must parse
      # back into the same set. A short run on every change catches a
      # regression; the corpus is where the long runs live.
      - name: Fuzz
        run: go test ./nodeset/ -run '^$' -fuzz FuzzParseFold -fuzztime 90s

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: nodeset/testdata/fuzz/

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The release ships a static binary, so the release targets have to
      # build without cgo on every change rather than at tag time.
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          set -euxo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/clusterctl
          done

  release-tag:
    name: Release tag verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release workflow runs only when a tag is pushed, so the check that
      # refuses a tag is tested here against tags made on the spot.
      - name: Test the tag verification
        run: .github/scripts/verify-release-tag_test.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      # The whole history: every release's manual is built from its tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The site as the Pages workflow publishes it, every release's manual
      # included, so a change that would break publishing fails here. The
      # command reference and the schemas are generated on the way, so a
      # command that cannot be documented is a broken command.
      - name: Build the manual of every version
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/build.sh https://gsi-hpc.github.io/clusterctl/
