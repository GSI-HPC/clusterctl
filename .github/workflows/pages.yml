name: Manual

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'doc/**'
      - 'internal/cli/**'
      - 'internal/apis/**'
      - 'internal/tools/gendocs/**'
      - '.github/workflows/pages.yml'
  # A release moves the manual at the root to it. GoReleaser publishes the
  # release with the GITHUB_TOKEN, and events that token causes start no
  # workflow, so the trigger is the release workflow finishing instead. That
  # runs on the default branch, which the github-pages environment lets
  # deploy; unless told otherwise, it refuses a run on a tag.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is allowed to finish so a
# half-published site is never live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # A release that failed published nothing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The whole history: every release's manual is built from its tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - uses: actions/configure-pages@v6
        id: pages

      # The latest release at the root, every minor line under /vX.Y/ and
      # main under /dev/, each built from its own tree. The command reference
      # and the JSON Schemas describe the binary they are generated from, so
      # they are generated here, for each version, and never committed.
      - name: Build the manual of every version
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/build.sh "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
