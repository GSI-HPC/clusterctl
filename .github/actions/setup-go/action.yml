name: Set up Go
description: >-
  Go and, when asked, sops, at the versions mise.toml names, so that CI, the
  release and a contributor's "mise install" use the same ones.

inputs:
  sops:
    description: Install sops too, which the tests of Secret documents run.
    default: 'false'
  sops-version:
    description: A sops other than the one mise.toml pins, such as the oldest supported.
    default: ''
  cache:
    description: >-
      The kind of job the Go module and build caches are kept for. A job
      that builds much of its own, such as the race detector's, keeps a
      cache of its own: under one key for every job, the first job to end
      saved it, a quick one, and the heavy ones started cold. Jobs that
      build little share one.
    default: shared

runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        set -euo pipefail
        go=$(sed -n 's/^go = "\([0-9.]*\)"$/\1/p' mise.toml)
        sops=$(sed -n 's/^sops = "\([0-9.]*\)"$/\1/p' mise.toml)
        # Without a version setup-go would quietly use the runner's own Go.
        if [ -z "$go" ] || [ -z "$sops" ]; then
          echo "::error::mise.toml names no go or no sops version"
          exit 1
        fi
        echo "go=$go" >> "$GITHUB_OUTPUT"
        echo "sops=${SOPS_VERSION:-$sops}" >> "$GITHUB_OUTPUT"
      env:
        SOPS_VERSION: ${{ inputs.sops-version }}

    # The newest patch of the release line, because Go ships the standard
    # library's security fixes as patch releases, and a binary is only as
    # patched as the toolchain that linked it. go.mod states the oldest
    # version the code compiles with. The caches are kept below, by kind.
    - id: go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ steps.versions.outputs.go }}
        check-latest: true
        cache: false

    - id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    # A cache of another kind is a better start than none: the modules and
    # most of the standard library are the same.
    - uses: actions/cache@v6
      with:
        path: |
          ${{ steps.paths.outputs.modules }}
          ${{ steps.paths.outputs.build }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

    # Built from its tagged source, which the Go checksum database vouches
    # for, the same way on every runner, once for each sops and Go version:
    # the build took over a minute of every job that tests Secret documents.
    # Each version has a directory of its own.
    - id: sops
      if: inputs.sops == 'true' || inputs.sops-version != ''
      shell: bash
      env:
        SOPS_VERSION: ${{ steps.versions.outputs.sops }}
      run: echo "dir=$HOME/.local/sops/$SOPS_VERSION" >> "$GITHUB_OUTPUT"

    - id: sops-cache
      if: steps.sops.outputs.dir != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.sops.outputs.dir }}
        key: sops-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.sops }}-go${{ steps.go.outputs.go-version }}

    - if: steps.sops.outputs.dir != '' && steps.sops-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SOPS_VERSION: ${{ steps.versions.outputs.sops }}
        GOBIN: ${{ steps.sops.outputs.dir }}
      run: go install "github.com/getsops/sops/v3/cmd/sops@v${SOPS_VERSION}"

    - if: steps.sops.outputs.dir != ''
      shell: bash
      env:
        DIR: ${{ steps.sops.outputs.dir }}
      run: |
        echo "$DIR" >> "$GITHUB_PATH"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
