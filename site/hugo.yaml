# SPDX-License-Identifier: LGPL-3.0-or-later

baseURL: https://gsi-hpc.github.io/clusterctl/
title: clusterctl
languageCode: en-gb

# Hextra is a Hugo module, so the theme is fetched through the same module
# proxy as the Go dependencies. No Node, no package manager.
module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: false
hasCJKLanguage: false

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

markup:
  highlight:
    noClasses: false
    style: github
    lineNos: false
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

menu:
  main:
    - name: Manual
      pageRef: /docs
      weight: 1
    - name: Commands
      pageRef: /reference
      weight: 2
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: https://github.com/GSI-HPC/clusterctl
      params:
        icon: github

  sidebar:
    - identifier: design
      name: "Design notes ↗"
      url: https://github.com/GSI-HPC/clusterctl/tree/main/doc
      weight: 9

params:
  description: >-
    One binary to administer HPC clusters: reach every host, select nodes,
    fan out commands, drive service processors, reinstall nodes and
    administer Slurm.

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  theme:
    default: system
    displayToggle: true

  page:
    width: normal

  editURL:
    enable: true
    base: https://github.com/GSI-HPC/clusterctl/edit/main/site/content

  highlight:
    copy:
      enable: true
      display: hover
