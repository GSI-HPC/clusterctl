# Hostname constants — sourced by source_me.sh; export to bin/ scripts
# Override any variable via environment before sourcing.

# SSH jump / tunnel gateways
export CLUSTER_HOST_SSH_PROXY="${CLUSTER_HOST_SSH_PROXY:-ssh.example.org}"
export CLUSTER_HOST_MGMT_GATEWAY="${CLUSTER_HOST_MGMT_GATEWAY:-mgmt-gw.example.org}"
export CLUSTER_HOST_TFTP="${CLUSTER_HOST_TFTP:-tftp.example.org}"

# Cluster management
export CLUSTER_HOST_LOGIN="${CLUSTER_HOST_LOGIN:-login.hpc.example.org}"
export CLUSTER_HOST_POOL="${CLUSTER_HOST_POOL:-pool.example.org}"
export CLUSTER_HOST_IFS="${CLUSTER_HOST_IFS:-ifs01.hpc.example.org}"
export CLUSTER_HOST_MIRROR="${CLUSTER_HOST_MIRROR:-mirror.hpc.example.org}"
export CLUSTER_HOST_INSTALL="${CLUSTER_HOST_INSTALL:-installer.hpc.example.org}"

# DHCP
export CLUSTER_HOST_DHCP="${CLUSTER_HOST_DHCP:-dhcp01.example.org}"

# IB / networking
export CLUSTER_HOST_IB_GATEWAY="${CLUSTER_HOST_IB_GATEWAY:-ibgw01.example.org}"

# SMTP
export CLUSTER_HOST_SMTP="${CLUSTER_HOST_SMTP:-smtp.example.org}"

# DNS
export CLUSTER_HOST_DNS="${CLUSTER_HOST_DNS:-dns01.example.org}"

# Cluster identification and naming
export CLUSTER_NAME="${CLUSTER_NAME:-Cluster}"
export CLUSTER_SLURM_ORG="${CLUSTER_SLURM_ORG:-default}"
export CLUSTER_SLURM_PARTITIONS="${CLUSTER_SLURM_PARTITIONS:-}"

# TFTP/Boot configuration
export CLUSTER_TFTP_GRUB_PATH="${CLUSTER_TFTP_GRUB_PATH:-/srv/tftp/grub}"
export CLUSTER_TFTP_ROOT="${CLUSTER_TFTP_ROOT:-/srv/tftp}"
export CLUSTER_KICKSTART_PATH="${CLUSTER_KICKSTART_PATH:-}"
# Node name prefix filtering the TFTP and PXESrv logs, empty for all nodes
export CLUSTER_NODE_PREFIX="${CLUSTER_NODE_PREFIX:-}"

# Data centre layout: printf format of PDU host names (filled in with rack
# row and rack), extended regular expression matching rack names
export CLUSTER_PDU_NAME_FORMAT="${CLUSTER_PDU_NAME_FORMAT:-pdu%s-%s}"
export CLUSTER_RACK_PATTERN="${CLUSTER_RACK_PATTERN:-^R[0-9][0-9]$}"

# Default BMC username
export CLUSTER_BMC_USER="${CLUSTER_BMC_USER:-admin}"
# Prefix of BMC host names, see bin/cluster-node-fqdn
export CLUSTER_BMC_PREFIX="${CLUSTER_BMC_PREFIX:-bmc-}"
