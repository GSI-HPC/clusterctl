# vim: nospell
# ClusterShell group definitions — replace with your cluster's configuration

[cluster1partition,p1]
map: ssh login.hpc.example.org -- sinfo -h -o "%N" -p $GROUP
all: ssh login.hpc.example.org -- sinfo -h -o "%N"
list: ssh login.hpc.example.org -- sinfo -h -o "%R"
reverse: ssh login.hpc.example.org -- sinfo -h -N -o "%R" -n $NODE

[cluster1state,s1]
map: ssh login.hpc.example.org -- sinfo -h -o "%N" -t $GROUP
all: ssh login.hpc.example.org -- sinfo -h -o "%N"
list: ssh login.hpc.example.org -- sinfo -h -o "%T" | tr -d '*~#$@+'
reverse: ssh login.hpc.example.org -- sinfo -h -N -o "%T" -n $NODE | tr -d '*~#$@+'
cache_time: 60
