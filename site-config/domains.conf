# Domain constants — sourced by source_me.sh; export to bin/ scripts
# Override any variable via environment before sourcing.

export CLUSTER_DOMAIN_HPC="${CLUSTER_DOMAIN_HPC:-hpc.example.org}"
export CLUSTER_DOMAIN_SITE="${CLUSTER_DOMAIN_SITE:-example.org}"
export CLUSTER_DOMAIN_MGMT="${CLUSTER_DOMAIN_MGMT:-mgmt.example.org}"
export CLUSTER_DOMAIN_MGMT_HPC="${CLUSTER_DOMAIN_MGMT_HPC:-mgmt.hpc.example.org}"
export CLUSTER_DOMAIN_INFRA="${CLUSTER_DOMAIN_INFRA:-infra.example.org}"

# Space separated name prefixes selecting the domain of short node names,
# see bin/cluster-node-fqdn
export CLUSTER_NODE_PREFIXES_HPC="${CLUSTER_NODE_PREFIXES_HPC:-exe sub wlm dbm}"
export CLUSTER_NODE_PREFIXES_SITE="${CLUSTER_NODE_PREFIXES_SITE:-}"
